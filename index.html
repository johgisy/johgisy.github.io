<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funktionsplot mit m und b</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            text-align: center;
        }
        .control-panel {
            background-color: #f1f1f1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .slider-box {
            margin: 10px 0;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .slider-box label {
            width: 180px;
            text-align: right;
        }
        input[type="range"] {
            width: 200px;
            margin: 0 15px;
        }
        .wert-anzeige {
            width: 50px;
            text-align: left;
            font-weight: bold;
        }
        canvas {
            border: 1px solid #ccc;
            background-color: #fbfbfb;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>Interaktiver Live-Funktionsplot</h1>
    <p>Intervall: <strong>[-1, 5]</strong> | Formel: <strong>f(x) = m * x + b</strong></p>

    <!-- Bedienfeld für beide Regler -->
    <div class="control-panel">
        <!-- Regler für die Steigung m -->
        <div class="slider-box">
            <label for="steigung">Steigung (m):</label>
            <input type="range" id="steigung" min="-5" max="5" step="0.1" value="1">
            <span id="m-wert" class="wert-anzeige">1.0</span>
        </div>

        <!-- Neuer Regler für den Y-Achsenabschnitt b -->
        <div class="slider-box">
            <label for="abschnitt">Achsenabschnitt (b):</label>
            <input type="range" id="abschnitt" min="-5" max="5" step="0.1" value="0">
            <span id="b-wert" class="wert-anzeige">0.0</span>
        </div>
    </div>

    <!-- Das Zeichenfeld -->
    <canvas id="plotCanvas" width="500" height="400"></canvas>

    <script>
        const canvas = document.getElementById('plotCanvas');
        const ctx = canvas.getContext('2d');
        
        const sliderM = document.getElementById('steigung');
        const sliderB = document.getElementById('abschnitt');
        
        const mWertAnzeige = document.getElementById('m-wert');
        const bWertAnzeige = document.getElementById('b-wert');

        // Mathematischer Bereich des Koordinatensystems
        const xMin = -1, xMax = 5;
        const yMin = -10, yMax = 10; // Erweitert, damit b Platz zum Wandern hat

        // Funktion zur Umrechnung von Mathe-Koordinaten in Pixel-Koordinaten
        function toPixelX(x) {
            return ((x - xMin) / (xMax - xMin)) * canvas.width;
        }

        function toPixelY(y) {
            // Y-Achse spiegeln, da Pixel im Canvas von oben nach unten zählen
            return canvas.height - (((y - yMin) / (yMax - yMin)) * canvas.height);
        }

        function zeichnePlot() {
            // Aktuelle Werte aus den Slidern auslesen
            const m = parseFloat(sliderM.value);
            const b = parseFloat(sliderB.value);

            // Textanzeigen neben den Slidern aktualisieren
            mWertAnzeige.textContent = m.toFixed(1);
            bWertAnzeige.textContent = b.toFixed(1);

            // Canvas für den neuen Frame komplett leeren
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Koordinatengitter zeichnen (Schrittweite 1)
            ctx.strokeStyle = '#e5e5e5';
            ctx.lineWidth = 1;
            
            // Vertikale Gitterlinien (X-Achse)
            for (let x = xMin; x <= xMax; x++) {
                let px = toPixelX(x);
                ctx.beginPath();
                ctx.moveTo(px, 0);
                ctx.lineTo(px, canvas.height);
                ctx.stroke();
            }
            // Horizontale Gitterlinien (Y-Achse)
            for (let y = yMin; y <= yMax; y++) {
                let py = toPixelY(y);
                ctx.beginPath();
                ctx.moveTo(0, py);
                ctx.lineTo(canvas.width, py);
                ctx.stroke();
            }

            // 2. Hauptachsen fett zeichnen (falls sie im Sichtfeld liegen)
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 2;
            
            // Haupt-Y-Achse (bei x = 0)
            if (xMin <= 0 && xMax >= 0) {
                ctx.beginPath();
                ctx.moveTo(toPixelX(0), 0);
                ctx.lineTo(toPixelX(0), canvas.height);
                ctx.stroke();
            }
            // Haupt-X-Achse (bei y = 0)
            if (yMin <= 0 && yMax >= 0) {
                ctx.beginPath();
                ctx.moveTo(0, toPixelY(0));
                ctx.lineTo(canvas.width, toPixelY(0));
                ctx.stroke();
            }

            // 3. Den Funktionsgraphen zeichnen: f(x) = m * x + b
            ctx.strokeStyle = '#007BFF';
            ctx.lineWidth = 4;
            ctx.beginPath();

            // Startpunkt bei x = -1 berechnen
            let startY = m * xMin + b;
            ctx.moveTo(toPixelX(xMin), toPixelY(startY));

            // Endpunkt bei x = 5 berechnen
            let endY = m * xMax + b;
            ctx.lineTo(toPixelX(xMax), toPixelY(endY));
            
            ctx.stroke();
        }

        // Event-Listener: Beide Regler rufen bei Änderung dieselbe Funktion auf
        sliderM.addEventListener('input', zeichnePlot);
        sliderB.addEventListener('input', zeichnePlot);

        // Initiales Zeichnen beim Laden der Seite
        zeichnePlot();
    </script>

</body>
</html>
